<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>
        VoyLlegando - Empresa
    </title>

    <link
        rel="stylesheet"
        href="/css/app.css?v=6">
</head>

<body>

<header class="app-header">

    <div class="app-logo">
        VoyLlegando
    </div>

    <div>

        <div
            id="nombreUsuario"
            class="app-usuario">
        </div>

        <button
            class="btn btn-secundario"
            onclick="logout()">

            Salir

        </button>

    </div>

</header>

<main class="contenido">

    <h1 class="titulo-pagina">
        Empresa de Transporte
    </h1>

    <div class="menu-modulos">

        <!-- ========================================= -->
        <!-- MI VIAJE                                  -->
        <!-- ========================================= -->

        <div
            class="modulo"
            onclick="abrirMiViaje()">

            <div class="modulo-icono">
                🚚
            </div>

            <div class="modulo-titulo">
                Mi Viaje
            </div>

            <div class="modulo-descripcion">
                Ver recorrido, ubicación y estado del viaje
            </div>

        </div>


        <!-- ========================================= -->
        <!-- VIAJES PENDIENTES                         -->
        <!-- ========================================= -->

        <div
            class="modulo"
            onclick="abrirViajesPendientes()">

            <div class="modulo-icono">
                📋
            </div>

            <div class="modulo-titulo">
                Viajes Pendientes
            </div>

            <div class="modulo-descripcion">
                Ver viajes disponibles de mis Logísticas
            </div>

        </div>


        <!-- ========================================= -->
        <!-- MIS LOGISTICAS                            -->
        <!-- ========================================= -->

        <div
            class="modulo"
            onclick="abrirMisLogisticas()">

            <div class="modulo-icono">
                🔗
            </div>

            <div class="modulo-titulo">
                Mis Logísticas
            </div>

            <div class="modulo-descripcion">
                Vincularme con empresas de Logística
            </div>

        </div>


        <!-- ========================================= -->
        <!-- MI PERFIL                                 -->
        <!-- ========================================= -->

        <div
            class="modulo"
            onclick="abrirMiPerfil()">

            <div class="modulo-icono">
                👤
            </div>

            <div class="modulo-titulo">
                Mi Perfil
            </div>

            <div class="modulo-descripcion">
                Datos de la empresa y del equipo
            </div>

        </div>

    </div>

</main>


<script src="/js/api.js?v=6"></script>
<script src="/js/auth.js?v=6"></script>


<script>

    // =======================================================
    // INICIO
    // =======================================================

    async function iniciar()
    {
        const perfil =
            await validarSesion(
                "E"
            );

        if (!perfil)
            return;

        document
            .getElementById(
                "nombreUsuario"
            )
            .textContent =
                perfil.nombre;
    }


    // =======================================================
    // MI VIAJE
    // =======================================================

    function abrirMiViaje()
    {
        window.location.href =
            "/miviaje.html?v=1";
    }


    // =======================================================
    // VIAJES PENDIENTES
    // =======================================================

    function abrirViajesPendientes()
    {
        window.location.href =
            "/viajes-pendientes.html";
    }


    // =======================================================
    // MIS LOGISTICAS
    // =======================================================

    function abrirMisLogisticas()
    {
        window.location.href =
            "/mis-logisticas.html";
    }


    // =======================================================
    // MI PERFIL
    // =======================================================

    function abrirMiPerfil()
    {
        window.location.href =
            "/mi-perfil.html";
    }


    // =======================================================
    // INICIAR
    // =======================================================

    iniciar();

</script>

</body>

</html>
