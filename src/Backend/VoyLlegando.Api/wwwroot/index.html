<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>VoyLlegando</title>

    <link
        rel="stylesheet"
        href="/css/app.css?v=200">

    <style>
        .login-card-inicio {
            max-width: 380px;
            padding: 0 24px 9px;
            border-radius: 14px;
        }

        .login-card-inicio .logo-bloque {
            margin: 0 -24px 12px;
            padding: 23px 16px 20px;
        }

        .login-card-inicio .logo-icono {
            display: block;
            width: 46px;
            height: 56px;
            margin-bottom: 5px;
            margin-left: auto;
            margin-right: auto;
            object-fit: contain;
            border-radius: 8px;
        }

        .login-card-inicio .login-titulo {
            font-size: 28px;
        }

        .login-card-inicio .login-subtitulo {
            margin-top: 4px;
            font-size: 13px;
        }

        .login-card-inicio .form-grupo {
            margin-bottom: 9px;
        }

        .login-card-inicio .form-grupo label {
            margin-bottom: 4px;
            font-size: 13px;
        }

        .login-card-inicio .form-control {
            padding: 9px 11px;
            font-size: 15px;
        }

        .login-card-inicio .btn {
            padding: 10px 14px;
        }

        .registro-inicio {
            margin-top: 9px;
            text-align: center;
        }

        .registro-inicio-texto {
            margin-bottom: 2px;
            color: #666;
            font-size: 13px;
        }

        .registro-inicio-enlace {
            color: #159dcc;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
        }

        .login-card-inicio .mensaje:empty {
            display: none;
        }

        @media (max-width: 700px) {
            .login-pagina {
                padding: 12px;
            }

            .login-card-inicio {
                max-width: 360px;
                padding: 0 18px 7px;
            }

            .login-card-inicio .logo-bloque {
                margin: 0 -18px 10px;
                padding: 20px 12px 17px;
            }

            .login-card-inicio .logo-icono {
                width: 42px;
                height: 51px;
            }

            .login-card-inicio .login-titulo {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

<div class="login-pagina">

    <div class="login-card login-card-inicio">

        <div class="logo-bloque">

            <img
                class="logo-icono"
                src="/img/icono-origen-destino.png"
                alt="Origen y destino">

            <h1 class="login-titulo">
                VoyLlegando
            </h1>

            <div class="login-subtitulo">
                Gestión y seguimiento de viajes
            </div>

        </div>

        <div class="form-grupo">

            <label for="celular">
                Celular
            </label>

            <input
                id="celular"
                class="form-control"
                type="text"
                inputmode="numeric"
                autocomplete="username"
                placeholder="Ingrese su celular">

        </div>

        <div class="form-grupo">

            <label for="clave">
                Contraseña
            </label>

            <input
                id="clave"
                class="form-control"
                type="password"
                autocomplete="current-password"
                placeholder="Ingrese su contraseña">

        </div>

        <button
            id="btnIngresar"
            class="btn btn-principal btn-ancho"
            type="button"
            onclick="login()">

            Ingresar

        </button>


        <!-- =====================================================
             REGISTRO EMPRESA
        ====================================================== -->

        <div class="registro-inicio">

            <div class="registro-inicio-texto">

                ¿Es una empresa nueva?

            </div>

            <a
                href="/registro.html"
                class="registro-inicio-enlace">

                Registrarse

            </a>

        </div>


        <div id="mensaje" class="mensaje"></div>

    </div>

</div>


<!-- =========================================================
     SCRIPTS
========================================================== -->

<script src="/js/api.js?v=200"></script>
<script src="/js/auth.js?v=201"></script>

<script>

    redirigirSiYaEstaLogueado();

    configurarEnterLogin();

</script>

</body>

</html>
