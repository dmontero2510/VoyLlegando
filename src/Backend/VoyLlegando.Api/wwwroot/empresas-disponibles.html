<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empresas disponibles - VoyLlegando</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #f2f5f8;
            color: #162033;
            font-family: Arial, sans-serif;
        }
        .cabecera {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 18px;
            background: #0b1028;
            color: white;
        }
        .marca { font-size: 20px; font-weight: 700; }
        .empresa { flex: 1; text-align: center; font-weight: 600; }
        .volver {
            border: 0;
            border-radius: 8px;
            padding: 9px 13px;
            background: #28b5df;
            color: #07111d;
            font-weight: 700;
            cursor: pointer;
        }
        main { width: min(760px, 100%); margin: 0 auto; padding: 20px 14px; }
        h1 { margin: 0 0 5px; font-size: 25px; }
        .subtitulo { margin: 0 0 16px; color: #586579; }
        .resumen { margin-bottom: 10px; font-weight: 700; }
        .lista { display: grid; gap: 10px; }
        .tarjeta {
            display: grid;
            grid-template-columns: 42px minmax(0, 1fr) auto;
            align-items: center;
            gap: 12px;
            padding: 13px 15px;
            border: 1px solid #d8e0e9;
            border-radius: 12px;
            background: white;
            box-shadow: 0 3px 10px rgba(12, 25, 48, .06);
        }
        .orden {
            display: grid;
            place-items: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #28b5df;
            color: #07111d;
            font-weight: 800;
        }
        .nombre { overflow: hidden; font-size: 17px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
        .detalle { margin-top: 4px; color: #667286; font-size: 13px; }
        .fecha { text-align: right; color: #26364b; font-size: 14px; font-weight: 600; white-space: nowrap; }
        .vacio, .error {
            padding: 25px 16px;
            border-radius: 12px;
            background: white;
            text-align: center;
            color: #667286;
        }
        .error { color: #a52323; }
        @media (max-width: 560px) {
            .cabecera { padding: 10px; }
            .empresa { display: none; }
            main { padding: 15px 10px; }
            .tarjeta { grid-template-columns: 38px minmax(0, 1fr); gap: 9px; }
            .fecha { grid-column: 2; text-align: left; }
        }
    </style>
</head>
<body>
    <header class="cabecera">
        <div class="marca">VoyLlegando</div>
        <div id="nombreLogistica" class="empresa">Logística</div>
        <button type="button" class="volver" onclick="volver()">Volver</button>
    </header>
    <main>
        <h1>Empresas disponibles</h1>
        <p class="subtitulo">Orden FIFO: primero aparece quien está disponible desde hace más tiempo.</p>
        <div id="resumen" class="resumen"></div>
        <div id="lista" class="lista"><div class="vacio">Cargando...</div></div>
    </main>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js?v=5"></script>
    <script>
        function escapar(valor) {
            const div = document.createElement("div");
            div.textContent = valor == null ? "" : String(valor);
            return div.innerHTML;
        }

        function formatearFecha(valor) {
            if (!valor) return "Fecha no registrada";
            const fecha = new Date(valor);
            if (Number.isNaN(fecha.getTime())) return "Fecha no registrada";
            return fecha.toLocaleString("es-AR", {
                day: "2-digit", month: "2-digit", year: "numeric",
                hour: "2-digit", minute: "2-digit"
            }) + " hs";
        }

        async function iniciar() {
            const perfil = await validarSesion("L");
            if (!perfil) return;
            document.getElementById("nombreLogistica").textContent =
                perfil.nombreLogistica || "Logística";
            await cargar();
        }

        async function cargar() {
            const lista = document.getElementById("lista");
            const resumen = document.getElementById("resumen");
            try {
                const empresas = await API.get("/api/Viajes/empresas-disponibles");
                resumen.textContent = `${empresas.length} empresa${empresas.length === 1 ? "" : "s"} disponible${empresas.length === 1 ? "" : "s"}`;
                if (!empresas.length) {
                    lista.innerHTML = '<div class="vacio">No hay Empresas de Transporte disponibles.</div>';
                    return;
                }
                lista.innerHTML = empresas.map((empresa, indice) => `
                    <article class="tarjeta">
                        <div class="orden">${indice + 1}</div>
                        <div>
                            <div class="nombre">${escapar(empresa.nombre)}</div>
                            <div class="detalle">${escapar(empresa.celular || "Sin celular")}</div>
                        </div>
                        <div class="fecha">Desde ${escapar(formatearFecha(empresa.fechaDisponibilidad))}</div>
                    </article>
                `).join("");
            } catch (error) {
                resumen.textContent = "";
                lista.innerHTML = `<div class="error">${escapar(error.message)}</div>`;
            }
        }

        function volver() { window.location.href = "/logistica.html"; }
        iniciar();
    </script>
</body>
</html>
