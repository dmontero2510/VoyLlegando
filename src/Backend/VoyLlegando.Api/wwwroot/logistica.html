<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>
        VoyLlegando - Logística
    </title>

    <link
    	rel="stylesheet"
    	href="/css/app.css?v=3">

    <style>

        /* =============================================
           HEADER LOGISTICA
        ============================================= */

        .header-logistica {
            background: #0d0d27;
            border-bottom: 4px solid #28b5e5;

            min-height: 72px;

            padding: 12px 24px;

            display: grid;

            grid-template-columns:
                1fr 2fr 1fr;

            align-items: center;

            gap: 20px;
        }


        .header-marca {
            justify-self: start;

            color: white;

            font-size: 22px;
            font-weight: bold;

            white-space: nowrap;
        }


        .header-marca::before {
            content: "■";

            color: #28b5e5;

            margin-right: 9px;
        }


        .header-empresa {
            justify-self: center;

            text-align: center;

            color: #28b5e5;

            font-size: 20px;
            font-weight: bold;

            text-transform: uppercase;

            letter-spacing: .5px;
        }


        .header-derecha {
            justify-self: end;

            display: flex;

            align-items: center;

            gap: 14px;
        }


        .header-usuario {
            color: white;

            font-size: 14px;

            white-space: nowrap;
        }


        .btn-salir {
            border:
                1px solid
                rgba(255,255,255,.45);

            background:
                transparent;

            color:
                white;

            padding:
                8px 13px;

            border-radius:
                7px;

            cursor:
                pointer;

            font-weight:
                bold;
        }


        .btn-salir:hover {
            background:
                rgba(255,255,255,.10);
        }


        /* =============================================
           CONTENIDO
        ============================================= */

        .contenido {
            padding:
                26px;

            max-width:
                1300px;

            margin:
                0 auto;
        }


        /* =============================================
           TITULO
        ============================================= */

        .titulo-logistica {
            margin:
                0 0 25px 0;

            font-size:
                27px;

            color:
                #0d0d27;
        }


        .titulo-logistica::after {
            content: "";

            display:
                block;

            margin-top:
                8px;

            width:
                55px;

            height:
                4px;

            border-radius:
                4px;

            background:
                #28b5e5;
        }


        /* =============================================
           MENU
        ============================================= */

        .menu-logistica {
            display:
                grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(
                        220px,
                        1fr
                    )
                );

            gap:
                20px;
        }


        .menu-item {
            position:
                relative;

            background:
                white;

            border:
                1px solid
                #dce2e8;

            border-radius:
                12px;

            min-height:
                170px;

            padding:
                26px 18px;

            cursor:
                pointer;

            text-align:
                center;

            overflow:
                hidden;

            box-shadow:
                0 3px 10px
                rgba(13,13,39,.06);

            transition:
                transform .15s,
                box-shadow .15s;
        }


        .menu-item::before {
            content: "";

            position:
                absolute;

            top:
                0;

            left:
                0;

            width:
                100%;

            height:
                5px;

            background:
                #28b5e5;
        }


        .menu-item:hover {
            transform:
                translateY(-4px);

            box-shadow:
                0 8px 25px
                rgba(13,13,39,.13);
        }


        .menu-icono {
            font-size:
                38px;

            margin-bottom:
                12px;
        }


        .menu-texto {
            display:
                block;
        }


        .menu-titulo {
            color:
                #0d0d27;

            font-size:
                17px;

            font-weight:
                bold;

            margin-bottom:
                7px;
        }


        .menu-descripcion {
            color:
                #6c7280;

            font-size:
                13px;

            line-height:
                1.45;
        }


        /* =============================================
           TABLET
        ============================================= */

        @media (max-width: 900px) {

            .menu-logistica {
                grid-template-columns:
                    repeat(
                        2,
                        1fr
                    );
            }

        }


        /* =============================================
           CELULAR
        ============================================= */

        @media (max-width: 700px) {

            body {
                min-height:
                    100dvh;
            }


            .header-logistica {
                grid-template-columns:
                    1fr auto;

                padding:
                    8px 12px;

                gap:
                    5px;

                min-height:
                    58px;
            }


            .header-marca {
                grid-column:
                    1;

                grid-row:
                    1;

                font-size:
                    17px;
            }


            .header-derecha {
                grid-column:
                    2;

                grid-row:
                    1;

                gap:
                    6px;
            }


            .header-usuario {
                font-size:
                    11px;
            }


            .btn-salir {
                padding:
                    6px 9px;

                font-size:
                    12px;
            }


            .header-empresa {
                grid-column:
                    1 / -1;

                grid-row:
                    2;

                width:
                    100%;

                font-size:
                    14px;

                padding-top:
                    2px;
            }


            .contenido {
                padding:
                    10px 12px 12px 12px;
            }


            .titulo-logistica {
                font-size:
                    21px;

                margin-bottom:
                    10px;
            }


            .titulo-logistica::after {
                margin-top:
                    5px;

                height:
                    3px;

                width:
                    45px;
            }


            .menu-logistica {
                grid-template-columns:
                    1fr;

                gap:
                    7px;
            }


            .menu-item {
                min-height:
                    0;

                height:
                    calc(
                        (100dvh - 180px) / 5
                    );

                max-height:
                    110px;

                padding:
                    8px 12px;

                display:
                    flex;

                align-items:
                    center;

                gap:
                    12px;

                text-align:
                    left;

                border-radius:
                    10px;
            }


            .menu-item::before {
                width:
                    4px;

                height:
                    100%;
            }


            .menu-icono {
                flex:
                    0 0 40px;

                font-size:
                    28px;

                margin-bottom:
                    0;

                text-align:
                    center;
            }


            .menu-texto {
                flex:
                    1;
            }


            .menu-titulo {
                font-size:
                    15px;

                margin-bottom:
                    2px;
            }


            .menu-descripcion {
                font-size:
                    11px;

                line-height:
                    1.2;
            }

        }


        /* =============================================
           CELULARES BAJOS
        ============================================= */

        @media
        (max-width: 700px)
        and
        (max-height: 700px) {

            .header-logistica {
                min-height:
                    52px;

                padding:
                    6px 10px;
            }


            .header-marca {
                font-size:
                    16px;
            }


            .header-empresa {
                font-size:
                    13px;
            }


            .contenido {
                padding:
                    8px 10px;
            }


            .titulo-logistica {
                font-size:
                    19px;

                margin-bottom:
                    8px;
            }


            .menu-logistica {
                gap:
                    5px;
            }


            .menu-item {
                height:
                    calc(
                        (100dvh - 155px) / 5
                    );

                min-height:
                    54px;

                max-height:
                    80px;

                padding:
                    6px 10px;
            }


            .menu-icono {
                font-size:
                    25px;

                flex-basis:
                    34px;
            }


            .menu-titulo {
                font-size:
                    14px;

                margin-bottom:
                    0;
            }


            .menu-descripcion {
                display:
                    none;
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header-logistica">

    <div class="header-marca">
        VoyLlegando
    </div>


    <div
        id="nombreLogistica"
        class="header-empresa">

        Logística

    </div>


    <div class="header-derecha">

        <div
            id="nombreUsuario"
            class="header-usuario">
        </div>


        <button
            type="button"
            class="btn-salir"
            onclick="logout()">

            Salir

        </button>

    </div>

</header>


<!-- =====================================================
     CONTENIDO
===================================================== -->

<main class="contenido">


    <h1 class="titulo-logistica">
        Logística
    </h1>


    <div class="menu-logistica">


        <!-- =============================================
             VIAJES
        ============================================== -->

        <div
            class="menu-item"
            onclick="
                window.location.href =
                '/viajes.html'
            ">

            <div class="menu-icono">
                🚚
            </div>


            <div class="menu-texto">

                <div class="menu-titulo">
                    Viajes
                </div>

                <div class="menu-descripcion">
                    Crear y administrar viajes
                </div>

            </div>

        </div>


        <!-- =============================================
             PRODUCTORES
        ============================================== -->

        <div
            class="menu-item"
            onclick="
                window.location.href =
                '/productores.html'
            ">

            <div class="menu-icono">
                🌾
            </div>


            <div class="menu-texto">

                <div class="menu-titulo">
                    Productores y Campos
                </div>

                <div class="menu-descripcion">
                    Administrar productores y campos
                </div>

            </div>

        </div>


        <!-- =============================================
             PLANTAS
        ============================================== -->

        <div
            class="menu-item"
            onclick="
                window.location.href =
                '/plantas.html'
            ">

            <div class="menu-icono">
                🏭
            </div>


            <div class="menu-texto">

                <div class="menu-titulo">
                    Plantas y Destinos
                </div>

                <div class="menu-descripcion">
                    Administrar plantas y destinos
                </div>

            </div>

        </div>


        <!-- =============================================
             CEREALES
        ============================================== -->

        <div
            class="menu-item"
            onclick="
                window.location.href =
                '/cereales.html'
            ">

            <div class="menu-icono">
                🌽
            </div>


            <div class="menu-texto">

                <div class="menu-titulo">
                    Cereales
                </div>

                <div class="menu-descripcion">
                    Administrar tipos de cereales
                </div>

            </div>

        </div>


        <!-- =============================================
             SEGUIMIENTO
        ============================================== -->

        <div
            class="menu-item"
            onclick="
                window.location.href =
                '/mapa.html'
            ">

            <div class="menu-icono">
                🗺️
            </div>


            <div class="menu-texto">

                <div class="menu-titulo">
                    Seguimiento
                </div>

                <div class="menu-descripcion">
                    Ver recorridos y ubicación de transportes
                </div>

            </div>

        </div>


    </div>

</main>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="/js/api.js"></script>

<script src="/js/auth.js"></script>


<script>

    async function iniciar()
    {
        const perfil =
            await validarSesion("L");


        if (!perfil)
            return;


        const nombreUsuario =
            document.getElementById(
                "nombreUsuario"
            );


        const nombreLogistica =
            document.getElementById(
                "nombreLogistica"
            );


        if (nombreUsuario)
        {
            nombreUsuario.textContent =
                perfil.nombre || "";
        }


        if (nombreLogistica)
        {
            nombreLogistica.textContent =
                perfil.nombreLogistica ||
                "Logística";
        }
    }


    iniciar();

</script>
<script src="/js/api.js?v=3"></script>
<script src="/js/auth.js?v=3"></script>

</body>

</html>
